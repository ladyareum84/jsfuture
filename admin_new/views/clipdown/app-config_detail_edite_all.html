<script>
/**
 * @param {string} targetName - 체크/해제할 대상 체크박스들의 name
 */
function allUpdateChecked(targetName) {
    // 1. 클릭된 이벤트를 발생시킨 주체(전체선택 체크박스)를 찾습니다.
    // HTML 구조상 onclick이 input[type="checkbox"]에 걸려 있으므로 event.target을 활용합니다.
    const allBtn = event.target;
    const isChecked = allBtn.checked;
    
    // 2. 해당 그룹 내의 텍스트(span) 요소를 찾습니다.
    // 버튼 바로 옆 label 내부의 span id가 text_type 또는 text_media로 되어 있으므로 이를 활용합니다.
    // 만약 모든 전체선택 버튼의 텍스트를 바꾸고 싶다면 아래와 같이 타겟팅합니다.
    const btnText = allBtn.nextElementSibling.querySelector('span');
    
    if (btnText) {
        btnText.innerText = isChecked ? "전체 해제" : "전체 선택";
    }

    // 3. 대상 체크박스들 모두 체크/해제
    const checkboxes = document.getElementsByName(targetName);
    checkboxes.forEach((cb) => {
        cb.checked = isChecked;
    });
}

// [추가] 페이지 로드 시 모든 항목을 전체 선택 상태로 초기화하는 스크립트
window.onload = function() {
    // 1. 전체 선택 버튼들 체크 상태로 변경 및 텍스트 설정
    const allCheckboxes = ['all_type', 'all_media'];
    allCheckboxes.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.checked = true;
            const span = el.nextElementSibling.querySelector('span');
            if (span) span.innerText = "전체 해제";
        }
    });

    // 2. 모든 하위 체크박스 항목들 체크
    const targetNames = ['applyUpdateType[]', 'applyMedia[]'];
    targetNames.forEach(name => {
        const group = document.getElementsByName(name);
        group.forEach(cb => cb.checked = true);
    });
};
