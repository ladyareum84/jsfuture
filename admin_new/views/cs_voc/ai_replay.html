<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 상담 리플레이</title>
</head>

<body>
    <div class="page">
        <div class="page-wrapper">
        <!-- BEGIN PAGE HEADER -->
        <div class="page-header">
            <div class="container-xl">
                <div class="row align-items-center mw-100">
                    <div class="col">
                        <div class="mb-3">
                            <ol class="breadcrumb breadcrumb-arrows" aria-label="breadcrumbs">
                                <li class="breadcrumb-item">
                                    <a href="#">Home</a>
                                </li>
                                <li class="breadcrumb-item active">
                                    <a href="#">CS VOC</a>
                                </li>
                                <li class="breadcrumb-item active" aria-current="page">
                                    <a href="#">AI 상담 리플레이</a>
                                </li>
                            </ol>
                        </div>
                        <h2 class="page-title">AI 상담 리플레이</h2>
                        <div class="text-secondary mt-1">AI 상담 세션 내역을 조회하고 대화 내용을 재생합니다.</div>
                    </div>
                </div>
            </div>
        </div>
        <!-- END PAGE HEADER -->
        <!-- BEGIN PAGE BODY -->
        <div class="page-body">
            <div class="container-xl">
                <div class="row row-cards">
                    <!-- 조건검색 스타일 02 -->
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body">
                                <div class="filter-item">
                                    <div class="row row-cards">
                                        <div class="col-md-3">
                                            <div class="mb-3">
                                                <label class="form-label">조회구분</label>
                                                <select name="user[month]" class="form-select">
                                                    <option value="day" selected="selected">일별</option>
                                                    <option value="week">주별</option>
                                                    <option value="month">월별</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">조회기간</label>
                                                <div class="row">
                                                    <div class="input-icon w-50">
                                                        <span
                                                            class="input-icon-addon"><!-- Download SVG icon from http://tabler.io/icons/icon/calendar -->
                                                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                                                stroke-linecap="round" stroke-linejoin="round" class="icon icon-1">
                                                                <path
                                                                    d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12z">
                                                                </path>
                                                                <path d="M16 3v4"></path>
                                                                <path d="M8 3v4"></path>
                                                                <path d="M4 11h16"></path>
                                                                <path d="M11 15h1"></path>
                                                                <path d="M12 15v3"></path>
                                                            </svg></span>
                                                        <input class="form-control datepicker" placeholder="시작날짜" id="startDate" name="Date" value="">
                                                    </div>
                                                    <div class="input-icon w-50">
                                                        <span
                                                            class="input-icon-addon"><!-- Download SVG icon from http://tabler.io/icons/icon/calendar -->
                                                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                                                stroke-linecap="round" stroke-linejoin="round" class="icon icon-1">
                                                                <path
                                                                    d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12z">
                                                                </path>
                                                                <path d="M16 3v4"></path>
                                                                <path d="M8 3v4"></path>
                                                                <path d="M4 11h16"></path>
                                                                <path d="M11 15h1"></path>
                                                                <path d="M12 15v3"></path>
                                                            </svg></span>
                                                        <input class="form-control datepicker" placeholder="종료날짜" id="endDate" name="Date" value="">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="mb-3">
                                                <label class="form-label">채널</label>
                                                <select id="channel" name="channel" class="form-select">
                                                    <option value="all" selected="selected">전체</option>
                                                    <option value="chatbot">챗봇</option>
                                                    <option value="voice">음성상담</option>
                                                    <option value="kakao">카카오톡</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row row-cards">
                                        <div class="col-md-3">
                                            <div class="mb-3">
                                                <label class="form-label">&nbsp;</label>
                                                <div class="text-start">
                                                    <a href="#" id="searchButton" class="btn btn-outline-primary w-50">조회</a>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- END 조건검색 스타일 02-->
                    <!-- Content Table Style -->
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">AI 상담 세션 목록</h3>
                            </div>
                            <div class="card-table">
                            <div class="custom-table custom-table-lg table-responsive">
                                <table id="grid" class="table table-bordered"></table>
                            </div>
                        </div>
                        </div>
                    </div>
                    <!-- // Content Table Style -->
                </div>
            </div>
        </div>
        <!-- END PAGE BODY -->
        </div>
    </div>

    <!-- BEGIN 리플레이 모달 -->
    <div class="modal modal-blur fade" id="modal-replay" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">AI 상담 리플레이</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="replayContent" class="text-secondary">재생할 상담 세션을 선택해주세요.</div>
                </div>
            </div>
        </div>
    </div>
    <!-- END 리플레이 모달 -->
</body>
<script src="../../foundation/foundation.js"></script>
<script>
    // includeFoundation();
</script>
<script>
    const callback = () => {
        // Table Data
        const grid = new DataTable("#grid", {
            data: [

            ],
            columns: [
                {
                    title: '세션ID',
                    data: 'session_id'
                },
                {
                    title: '상담일시',
                    data: 'consult_date'
                },
                {
                    title: '채널',
                    data: 'channel'
                },
                {
                    title: '문의유형',
                    data: 'category'
                },
                {
                    title: 'AI 처리결과',
                    data: 'ai_result'
                },
                {
                    title: '재생',
                    data: 'session_id',
                    render: (data) => {
                        return `<a href="#" class="btn btn-sm btn-outline-primary btn-replay" data-session-id="${data}">재생</a>`;
                    }
                }

            ],
            ...dataTablesConfg,
        });

        // 재생 버튼 클릭 시 모달 오픈
        document.querySelector('#grid').addEventListener('click', (e) => {
            const btn = e.target.closest('.btn-replay');
            if (!btn) return;
            e.preventDefault();

            const sessionId = btn.dataset.sessionId;
            document.querySelector('#replayContent').textContent = `세션 ${sessionId} 상담 내용을 불러오는 중입니다.`;

            const modal = new bootstrap.Modal(document.querySelector('#modal-replay'));
            modal.show();
        });

             // date picker 설정
            if (window.Litepicker) {
                document.querySelectorAll('.datepicker').forEach((el) => {
                    new Litepicker({
                        element: el,
                        buttonText: {
                            previousMonth: `<!-- Download SVG icon from http://tabler.io/icons/icon/chevron-left -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-1"><path d="M15 6l-6 6l6 6" /></svg>`,
                            nextMonth: `<!-- Download SVG icon from http://tabler.io/icons/icon/chevron-right -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-1"><path d="M9 6l6 6l-6 6" /></svg>`,
                        },
                        lang: 'ko',
                        format: 'YYYY-MM-DD',
                        i18n: {
                            ko: {
                                weekdays: ['일', '월', '화', '수', '목', '금', '토'],
                                months: [
                                    '1월', '2월', '3월', '4월', '5월', '6월',
                                    '7월', '8월', '9월', '10월', '11월', '12월'
                                ],
                                nextMonth: '다음 달',
                                prevMonth: '이전 달',
                                reset: '초기화',
                                apply: '적용',
                            },
                        },
                    });
                });
            }

    }; //여기 안에 넣기
    includeFoundation(callback);
</script>

</html>
