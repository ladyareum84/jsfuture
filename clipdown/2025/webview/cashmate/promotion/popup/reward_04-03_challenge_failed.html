<!DOCTYPE html>
<html lang="ko">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">		
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">		
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="white">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no" />
    <title>팝업 - 골드버튼 획득 도전 보상 획득 실패</title>
    <link rel='stylesheet' href='../../resource/css/common.css' type='text/css'>
    <link rel='stylesheet' href='../../resource/css/style_cashmate.css' type='text/css'>

    <!-- IE8 에서 HTML5 요소와 미디어 쿼리를 위한 HTML5 shim 와 Respond.js -->

<body>
    <div class="wrap webview_cashmate">
    </div>

    <!-- layer Popup 골드버튼 획득 보상 -->
    <div id="" class="layer_popup popup_event popup_event_result">
        <div class="popup_wrap_full">
            <div class="popup_inner">
                <div id="goldButtonContainer" class="popup_contents ">            
                    <!-- step 4 challengeRewardFail : 도전 보상 획득 실패 -->
                    <div id="step4_challengeRewardFail" class="popup_content content_challenge">                       
                        <div class="content_box box_top">
                            <div class="ani_state">
                                <div class="ani_container">
                                    <div class="img_card img_card_default ani_effect ani_complete_check">
                                        <img src="../../resource/images/event/popup/img_challenge_point_02.svg" alt="">
                                    </div>
                                </div>
                            </div>
                            <div class="header_title">
                                <div class="title_description">
                                    <span class="ani_effect tit_reward_01 text-block">다음에는 더 높은 보상을</span>
                                    <span class="ani_effect tit_reward_02 text-block">받을 기회가 기다리고 있어요</span>
                                </div>
                            </div>
                            <div class="btn_popup_event btn_bottom">
                                <a id="confirm" href="#" class="btn btn_event_check ani_effect">확인</a>
                            </div>
                        </div> 
                    </div>
                    <!-- // 도전 보상 실패 -->
                </div>
            </div>
        </div>
    </div>
    <!-- // layer Popup 골드버튼 획득 보상 -->


    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.js"></script>

    <script src="../../resource/js/clipboard.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.3.0/dist/dotlottie-wc.js" type="module"></script>

</html>
