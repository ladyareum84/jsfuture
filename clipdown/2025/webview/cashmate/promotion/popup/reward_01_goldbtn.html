<!DOCTYPE html>
<html lang="ko">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">		
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">		
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="white">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no" />
    <title>팝업 - 골드버튼 획득 보상  </title>
    <link rel='stylesheet' href='../../resource/css/common.css' type='text/css'>
    <link rel='stylesheet' href='../../resource/css/style_cashmate.css' type='text/css'>

    <!-- IE8 에서 HTML5 요소와 미디어 쿼리를 위한 HTML5 shim 와 Respond.js -->
    <!-- WARNING: Respond.js 는 당신이 file:// 을 통해 페이지를 볼 때는 동작하지 않습니다. -->
    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
    <div class="wrap webview_cashmate">
    </div>

    <!-- layer Popup 골드버튼 획득 보상 -->
    <div id="" class="layer_popup popup_event popup_event_result">
        <div class="popup_wrap_full">
            <div class="popup_inner">
                <!-- 골드버튼 획득 -->
                <div id="goldButtonContainer" class="popup_contents">
                    <!-- step1 : 골드버튼 보상 받기 -->
                    <div id="step1" class="popup_content content_gold box_top">
                        <div class="content_box">
                            <div class="ani_state">
                                <div id="" class="ani_container">
                                    <div class="img_reward_goldBtn ani_effect ani_goldBtn">
                                        <img src="../../resource/images/event/img_badge_goldBtn.svg" alt="">
                                    </div>
                                    <div class="ani_reward_effect ain_gold_item">
                                        <div class="ani_sparkle_01 ani_effect">
                                            <dotlottie-player id="lottieSparkle" src="https://lottie.host/ec2057cd-a78d-443c-8708-408c08444f4a/lrYoTROElv.json" background="transparent" speed="1.5" style="width: 100%; height: 100%" loop autoplay></dotlottie-player>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="header_title">
                                <h1 id="title">
                                    <span class="text-block ani_effect tit_gold_01">골드버튼 완성!</span>
                                    <span class="text-block ani_effect tit_gold_02">보상을 받으러 가볼까요?</span>
                                </h1>
                            </div>
                        </div>
                        <div class="btn_popup_event btn_bottom">
                            <a id="goToStep2" href="#" class="btn btn_event_check btn_yellow ani_effect">보상 받으러가기</a>
                        </div>
                    </div>
                    <!-- // 골드버튼 획득 -->
            </div>
        </div>
    </div>
    <!-- // layer Popup 골드버튼 획득 보상 -->

    


    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.js"></script>    
    <script src="../../resource/js/common_cashmate.js"></script>
    <script src="../../resource/js/clipboard.min.js"></script>
    <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
</body>
</html>
